{% extends 'home.html' %}

{% block content %}

	<script src="//cdn.ckeditor.com/4.15.0/standard/ckeditor.js"></script>

	<div class="pf-section-label pf-section-label--first"><span>Write a post</span></div>

	<div class="pf-card">
		<form method="post" action="{% url 'post' %}">
			{% csrf_token %}

			<div class="pf-field">
				<label for="title">Title</label>
				<input id="title" type="text" name="title" maxlength="40">
			</div>

			<div class="pf-field">
				<label for="content">Content</label>
				<textarea rows="12" cols="90" name="content" id="content" placeholder="Write a post here..."></textarea>
				<script>CKEDITOR.replace('content', {height: 300, width: 800});</script>
			</div>

			<div class="pf-field">
				<label><input type="checkbox" name="anon" id="anon" style="width: auto; margin-right: 6px;">Post as anonymous</label>
			</div>

			<button type="submit" name="action" value="Post" class="pf-btn pf-btn--accent">Post</button>
		</form>
	</div>

{% endblock %}
