{% extends 'home.html' %}

{% block content %}

	<div class="pf-section-label pf-section-label--first"><span>{{ post.title }}</span></div>

	<div class="pf-card">
		<div class="pf-post-body">{{ post.content|safe }}</div>
		<p class="pf-post-meta" style="margin-top: 12px;">by <a class="pf-link" href="/users?user={{ post.author.username }}">{{ post.author }}</a> &middot; {{ post.time }}</p>
	</div>

	<p class="pf-note pf-center" style="margin-top: 16px;">Are you sure that you want to delete this post?</p>
	<p class="pf-center" style="margin-top: 10px;">
		<a class="pf-btn pf-btn--accent" href="delete_post?id={{ post.id }}&status=confirm">Delete</a>
	</p>

{% endblock %}
