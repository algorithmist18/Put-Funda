{% extends 'home.html' %}

{% block content %}

	<script src="//cdn.ckeditor.com/4.15.0/standard/ckeditor.js"></script>

	<div class="pf-section-label pf-section-label--first"><span>Edit post</span></div>

	<div class="pf-card">
		<form method="post" action="{% url 'edit_post' %}?id={{ id }}">
			{% csrf_token %}

			<div class="pf-field">
				<label for="form-title">Title</label>
				<input id="form-title" value="{{ post.title }}" name="title">
			</div>

			<div class="pf-field">
				<label for="content">Content</label>
				<textarea rows="12" cols="90" name="content" id="content">{{ post.content|safe }}</textarea>
				<script>CKEDITOR.replace('content', {height: 400, width: 600});</script>
			</div>

			<div class="pf-field">
				<label><input id="form-anon" type="checkbox" name="anon" style="width: auto; margin-right: 6px;">Post as anonymous</label>
			</div>

			<button type="submit" name="action" value="Update" class="pf-btn pf-btn--accent">Update</button>
		</form>
	</div>

{% endblock %}
