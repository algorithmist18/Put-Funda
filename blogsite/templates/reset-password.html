{% extends "home.html" %}
{% load i18n %}

{% block content %}

	<div class="pf-section-label pf-section-label--first"><span>Password reset</span></div>
	<h1 style="font-style: italic; font-size: 34px; margin-bottom: 20px;">Set a new password.</h1>

	<div class="pf-card">
		<form method="post" action="{% url 'reset' %}">
			{% csrf_token %}

			<div class="pf-field">
				<label>Password</label>
				{{ form.password1 }}
				<div class="pf-field-hint">Your password cannot be similar to your personal information, and cannot be entirely numeric.</div>
			</div>

			<div class="pf-field">
				<label>Confirmation</label>
				{{ form.password2 }}
				<div class="pf-field-hint">{{ form.password2.help_text }}</div>
			</div>

			<button type="submit" class="pf-btn pf-btn--accent pf-btn--block">{% trans 'Submit' %}</button>
		</form>
	</div>

{% endblock %}
