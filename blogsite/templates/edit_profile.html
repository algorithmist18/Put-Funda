{% extends 'home.html' %}
{% block content %}

	<div class="pf-section-label pf-section-label--first"><span>Edit profile</span></div>

	<div class="pf-card">
		<form action="{% url 'edit' %}?user={{ user.username }}" enctype="multipart/form-data" method="POST">
			{% csrf_token %}

			<div class="pf-field">
				<label for="first_name">First name</label>
				<input type="text" name="first_name" value="{{ user.first_name }}">
			</div>

			<div class="pf-field">
				<label for="last_name">Last name</label>
				<input type="text" name="last_name" value="{{ user.last_name }}">
			</div>

			<div class="pf-field">
				<label>Current date of birth</label>
				<input type="text" name="displayDOB" value="{{ user.profile.birth_date }}">
			</div>

			<div class="pf-field">
				<label for="dateOfBirth">New date of birth</label>
				<input type="date" name="dateOfBirth" value="{{ user.profile.birth_date }}">
			</div>

			<div class="pf-field">
				<label for="user-location">Location</label>
				<input type="text" id="user-location" name="location" value="{{ user.profile.location }}">
			</div>

			<div class="pf-field">
				<label for="email">Email</label>
				<input type="email" id="email" name="email" value="{{ user.email }}">
				<div class="pf-field-hint" id="confirm-email">{{ email_error_message }}</div>
			</div>

			<div class="pf-field">
				<label>Photo</label>
				{% if user.profile.picture %}
				<img id="img-preview" alt="Your avatar" src="{{ user.profile.picture.url }}" class="pf-question-image" style="max-width: 150px; margin-bottom: 10px;">
				{% endif %}
				<input id="image-input" type="file" name="avatar">
				<div class="pf-field-hint" id="image-confirm"></div>
			</div>

			<button type="submit" class="pf-btn pf-btn--accent">Save edits</button>
		</form>
	</div>

	<script type="text/javascript">

		function previewImage(input) {

			if (input.files && input.files[0]) {

				var fileReader = new FileReader();

				fileReader.onload = function (e) {
					$('#img-preview').attr('src', e.target.result);
				}

				fileReader.readAsDataURL(input.files[0]);
			}
		}

		function validateImage(e) {

			var imageFile = $('#image-input').val();
			var fileConfirm = $('#image-confirm');

			$.get("{% url 'image_check' %}", {imageFile: imageFile},

				function (data) {

					fileConfirm.html(data['message']);

					if (data['valid'] == 'YES') {
						previewImage(e);
					}
				}
			);
		}

		function validateEmail() {

			var email = $('#email').val();
			var emailConfirm = $('#confirm-email');

			email = email.trim();

			$.get("{% url 'email_check' %}", {email: email},

				function (data) {
					emailConfirm.html(data['message']);
				}
			);
		}

		function onChange() {

			$('#image-input').change(function () { validateImage(this) });
			$('#email').change(function () { validateEmail() });
		}

		$(document).ready(onChange);

	</script>

{% endblock %}
