{% extends 'home.html' %}
{% block content %}

	<div class="pf-section-label pf-section-label--first"><span>Delete question</span></div>
	<p class="pf-note" style="margin-bottom: 16px;">Are you sure you want to delete this question?</p>

	<div class="pf-card">
		<form method="post" action="{% url 'delete_q' %}?question_id={{ question.id }}&user={{ user.username }}">
			{% csrf_token %}

			<p class="pf-question-text">{{ question.question|safe }}</p>
			<p class="pf-post-meta">
				posted {{ question.time }} by
				{% if not question.author %}admin{% else %}{{ question.author }}{% endif %}
			</p>

			<input type="hidden" name="questions" value="{{ question.question }}">
			<button type="submit" name="action" value="Cancel" class="pf-btn">Cancel</button>
			<button type="submit" name="action" value="Delete" class="pf-btn pf-btn--accent">Delete</button>
		</form>
	</div>

{% endblock %}
