{% extends 'home.html' %}
{% block content %}

	<script src="//cdn.ckeditor.com/4.15.0/standard/ckeditor.js"></script>

	<div class="pf-section-label pf-section-label--first"><span>Ask a question</span></div>

	<div class="pf-card">
		<form action="{% url 'ask' %}" method="POST">
			{% csrf_token %}

			<div class="pf-field">
				<label for="title">Genre</label>
				<input type="text" name="title" required>
			</div>

			<div class="pf-field">
				<label for="question">Question</label>
				<textarea rows="15" cols="80" name="question" id="question" required></textarea>
				<script>CKEDITOR.replace('question', {height: 300, width: 800, fontSize: 14});</script>
			</div>

			<div class="pf-field">
				<label for="answer">Answer</label>
				<textarea rows="6" cols="50" name="answer" required></textarea>
			</div>

			<button type="submit" class="pf-btn pf-btn--accent">Ask</button>
		</form>
	</div>

{% endblock %}
