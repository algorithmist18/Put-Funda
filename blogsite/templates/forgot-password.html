{% extends 'home.html' %}

{% block content %}

	<script src="https://www.google.com/recaptcha/api.js" async defer></script>

	<div class="pf-section-label pf-section-label--first"><span>Password reset</span></div>
	<h1 style="font-style: italic; font-size: 34px; margin-bottom: 20px;">Forgot password?</h1>

	<div class="pf-card">
		<form id="forgot-password-form" method="post" action="{% url 'forgot' %}">
			{% csrf_token %}

			<div class="pf-field">
				<label for="email">Email</label>
				<input id="email" type="email" name="email">
			</div>

			<div class="pf-field">
				<div class="g-recaptcha" data-sitekey="6Lf1LWQhAAAAAFBp7VbX4faQoGN_l2EPJELUUxZI" data-callback="enableSendMail"></div>
			</div>

			<button id="submit-button" disabled="true" type="submit" class="pf-btn pf-btn--accent pf-btn--block">Send link</button>
		</form>

		{% if message %}
		<p id="email-sent-message" class="pf-note" style="margin-top: 14px;"><span>{{ message }}</span></p>
		{% endif %}
	</div>

	<script>

		function enableSendMail() {

			document.getElementById("submit-button").disabled = false;
		}

	</script>

{% endblock %}
