{% extends 'quiz_homepage_base.html' %}

{% block content %}

	<div class="pf-section-label pf-section-label--first"><span>Edit question</span></div>

	<div class="pf-card" id="question-box">
		<form method="post" enctype="multipart/form-data" action="{% url 'edit_question' %}?question_id={{ question.id }}">
			{% csrf_token %}

			<div class="pf-field">
				<label id="question-input">Question</label>
				<textarea rows="5" cols="70" name="question" required>{{ question.question }}</textarea>
			</div>

			<div class="pf-field">
				<label>Image</label>
				<input type="file" name="image">
			</div>

			<div class="pf-field">
				<label>Answer</label>
				<input type="text" name="answer" value="{{ question.answer }}" required>
			</div>

			<div class="pf-field">
				<label>Second answer</label>
				<input type="text" name="second_answer" value="{{ question.second_answer }}">
			</div>

			<div class="pf-field">
				<label>Third answer</label>
				<input type="text" name="third_answer" value="{{ question.third_answer }}">
			</div>

			<button type="submit" name="action" value="Edit question" class="pf-btn pf-btn--accent">Save</button>
		</form>
	</div>

{% endblock %}
