{% extends 'quiz_homepage_base.html' %}

{% block content %}

	<div class="pf-section-label pf-section-label--first"><span>Edit contest</span></div>
	<p class="pf-note" style="margin-bottom: 16px;">Edit the quiz contest here.</p>

	<div class="pf-card" id="quiz-edit">
		<form id="edit-contest-form" method="post" action="{% url 'edit_contest' %}?contest_id={{ contest.id }}&user={{ user.username }}">
			{% csrf_token %}

			<div class="pf-field">
				<label>Name</label>
				<input type="text" name="name" placeholder="Name your contest" value="{{ contest.name }}" required>
			</div>

			<div class="pf-field">
				<label>Description</label>
				<textarea name="description" rows="2" placeholder="A short description for players">{{ contest.description }}</textarea>
			</div>

			<div class="pf-field">
				<label for="genre">Genre</label>
				<select id="genre" name="genre">
					{% for value, label in genre_choices %}
					<option value="{{ value }}"{% if value == contest.genre %} selected{% endif %}>{{ label }}</option>
					{% endfor %}
				</select>
			</div>

			<div class="pf-field">
				<label for="date">Date</label>
				<input id="date" type="date" name="date" required>
			</div>

			<div class="pf-field">
				<label for="time">Time</label>
				<input id="time" type="time" name="time" required>
				<div class="pf-field-hint" id="confirm-date"></div>
			</div>

			<div class="pf-field">
				<label>Seconds per question</label>
				<input name="seconds-per-question" value="{{ contest.time_per_question }}">
			</div>

			<div class="pf-field">
				<label>Valid for (minutes)</label>
				<input name="valid-for" value="{{ contest.valid_for }}" min="30">
				<div class="pf-field-hint">1 day: 1440 mins</div>
			</div>

			<div class="pf-field">
				<label>CSV file</label>
				<input id="question-file" type="file" name="tsv-question-file">
			</div>

			<button type="submit" name="Schedule" id="edit-contest-submit" class="pf-btn pf-btn--accent">Save</button>
		</form>
	</div>

	<p class="pf-note pf-muted" style="margin-top: 12px;">The time will be considered invalid if it is within 15 minutes (before/after) another contest.</p>

	<script type="module">

		// A question file (CSV) is uploaded straight to Vercel Blob from
		// the browser, instead of through this form's own POST - Vercel's
		// serverless functions (this app included) reject any request over
		// 4.5MB, which a large CSV would otherwise hit. See
		// api/blob-upload-token.js and quiz/upload_tickets.py for the
		// other two pieces of this.
		import { upload } from 'https://esm.sh/@vercel/blob@2.9.0/client';

		var form = document.getElementById('edit-contest-form');
		var submitButton = document.getElementById('edit-contest-submit');
		var tsvInput = document.getElementById('question-file');

		form.addEventListener('submit', async function (event) {

			if (tsvInput.files.length === 0) {
				return; // no file to upload directly - let the form submit as-is
			}

			event.preventDefault();

			var file = tsvInput.files[0];

			submitButton.disabled = true;
			submitButton.textContent = 'Uploading your file...';

			try {

				var ticketResponse = await fetch("{% url 'quiz_upload_ticket' %}");

				if (!ticketResponse.ok) {
					throw new Error('Could not start the upload. Please try again.');
				}

				var ticketData = await ticketResponse.json();

				var blob = await upload('quiz-uploads/' + file.name, file, {
					access: 'public',
					handleUploadUrl: '/api/blob-upload-token',
					clientPayload: ticketData.ticket,
					contentType: file.type || 'application/octet-stream',
				});

				var hiddenField = document.createElement('input');
				hiddenField.type = 'hidden';
				hiddenField.name = 'tsv-blob-url';
				hiddenField.value = blob.url;
				form.appendChild(hiddenField);

				// Disabled inputs are left out of the submitted form data -
				// this is what actually keeps the file's bytes out of the
				// request Django/Vercel sees.
				tsvInput.disabled = true;

				form.submit();

			} catch (error) {

				alert('File upload failed: ' + error.message);
				submitButton.disabled = false;
				submitButton.textContent = 'Save';
			}
		});

	</script>

	<script type="text/javascript">

		function validateContestTime() {

			var date = $('#date').val();
			var time = $('#time').val();
			var contestTime = date + ' ' + time;

			if (date && time) {

				$.get("{% url 'is_valid_date' %}", {contestTime: contestTime},

					function (data) {
						$('#confirm-date').html(data['message']);
					}
				);
			}
		}

		function onChange() {

			$('#date').change(function () { validateContestTime() });
			$('#time').change(function () { validateContestTime() });
		}

		$(document).ready(onChange);

	</script>

{% endblock %}
