{% extends 'quiz_homepage_base.html' %}

{% block content %}

	<div class="pf-section-label pf-section-label--first"><span>Delete question</span></div>

	<div class="pf-card" id="question-delete">
		<form method="post" action="{% url 'delete_question' %}?question_id={{ question.id }}">
			{% csrf_token %}

			<div class="pf-field">
				<label>Question</label>
				<textarea rows="5" cols="70" name="question" readonly>{{ question.question }}</textarea>
			</div>

			<div class="pf-field">
				<label>Answer</label>
				<input type="text" name="answer" value="{{ question.answer }}" readonly>
			</div>

			<button type="submit" name="action" value="Confirm delete" class="pf-btn pf-btn--accent">Confirm delete</button>
			<button type="submit" name="action" value="Back" class="pf-btn">Back</button>
		</form>
	</div>

{% endblock %}
