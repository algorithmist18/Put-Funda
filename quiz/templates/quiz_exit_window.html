{% load static %}
<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Put Funda | Contest complete</title>
		<link rel="stylesheet" href="{% static 'blogsite/css/theme.css' %}">
	</head>
	<body class="pf-theme">

		<header class="pf-masthead">
			<a class="pf-wordmark" href="{% url 'index' %}">Put Funda</a>
			<p class="pf-tagline">That's a wrap.</p>
		</header>

		<div class="pf-shell pf-center" style="padding-top: 60px;">

			<div class="pf-section-label pf-section-label--first"><span>Contest complete</span></div>
			<h1 style="font-style: italic; font-size: 32px; margin-bottom: 14px;">Nicely played.</h1>
			<p class="pf-note" style="margin-bottom: 24px;">Thank you for participating. You can close this window now.</p>

			{% if contest %}
			<a class="pf-btn pf-btn--accent" href="{% url 'leaderboard' %}?contest_id={{ contest.id }}">See the leaderboard</a>
			{% endif %}

		</div>

	</body>
</html>
